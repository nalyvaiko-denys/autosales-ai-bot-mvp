[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autosales-ai-bot"
version = "0.1.0"
description = "Async Telegram bot and CRM for AI-assisted car sales"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4",
  "alembic>=1.16,<2",
  "arq>=0.26,<1",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "greenlet>=3.2,<4",
  "itsdangerous>=2.2,<3",
  "langgraph>=1.2,<2",
  "openai>=1.99,<3",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5.0,<6",
  "sqladmin>=0.21,<1",
  "sqlalchemy>=2.0.41,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
autosales-api = "autosales.main:run_api"
autosales-bot = "autosales.bot:run_bot"
autosales-seed = "scripts.seed:main"

[tool.hatch.build.targets.wheel]
packages = ["autosales"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"autosales/admin.py" = ["RUF012"]
"autosales/ai/provider.py" = ["RUF012"]
"autosales/worker.py" = ["RUF012"]
