name: autosales-ai

x-app: &app
  build: .
  env_file:
    - path: .env.example
      required: true
    - path: .env
      required: false
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: autosales
      POSTGRES_USER: autosales
      POSTGRES_PASSWORD: autosales
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autosales -d autosales"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: autosales
      MINIO_ROOT_PASSWORD: autosales-local-secret
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  migrate:
    <<: *app
    restart: "no"
    command: alembic upgrade head

  api:
    <<: *app
    command: uvicorn autosales.main:app --host 0.0.0.0 --port 8000
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    <<: *app
    command: python -m autosales.bot
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: arq autosales.worker.WorkerSettings
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  minio_data:
